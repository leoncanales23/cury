<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Team Banana Polera</title><meta name="robots" content="noindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
/* Mismo formato que la landing XRIDERS: una columna de láminas a ancho completo, pestañas 01-05 arriba. */
:root{--bg:#0b0b0c;--panel:#141416;--line:#2a2a2e;--fg:#ecebe6;--muted:#8f8c86;--y:#FFD100;
 --f:'Oswald','Arial Narrow',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);padding-inline:16px;padding-block:24px 48px}
img{max-width:100%}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-weight:700;font-size:clamp(26px,4vw,40px);letter-spacing:3px;text-transform:uppercase;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--y)}
.k{font-size:12px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:6px 12px;font-size:13px;letter-spacing:2px;text-transform:uppercase;border-radius:3px}
nav a:hover,nav a:focus-visible{background:var(--y);color:var(--bg);border-color:var(--y);outline:none}
figure{margin:0;display:flex;flex-direction:column;gap:8px;scroll-margin-top:16px}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
figcaption{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
figcaption b{color:var(--fg);font-weight:700}
.files{border-top:1px solid var(--line);padding-top:14px;font-size:14px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;display:flex;flex-wrap:wrap;gap:8px 16px}
.files a{color:var(--y);text-decoration:none}
</style></head><body>
<div class="wrap">
<header>
 <div><div class="k">Sponsor oficial: VibraAlto.cl · Sello tecnológico: VBC</div><h1><em>Team Banana</em> · 100 kg challenge</h1></div>
 <nav><a href="#l01">01 Mockup</a><a href="#l02">02 Diseño</a><a href="#l03">03 Emblema</a><a href="#l04">04 Espalda</a><a href="#l05">05 Producción</a></nav>
</header>
<figure id="l01"><img src="TEAMBANANA_L01_Mockup_Frente_Espalda.jpg" alt="Lámina 01: mockup de estudio de la polera negra, frente y espalda"><figcaption><b>Lámina 01</b> · Mockup frente y espalda</figcaption></figure>
<figure id="l02"><img src="TEAMBANANA_L02_Diseno_Principal.jpg" alt="Lámina 02: arte de pecho, espalda y ambas mangas"><figcaption><b>Lámina 02</b> · Diseño principal · 4 ubicaciones</figcaption></figure>
<figure id="l03"><img src="TEAMBANANA_L03_Emblema_Frontal.jpg" alt="Lámina 03: emblema de la banana levantando la barra de 100 kg"><figcaption><b>Lámina 03</b> · Emblema frontal</figcaption></figure>
<figure id="l04"><img src="TEAMBANANA_L04_Espalda_Sponsor.jpg" alt="Lámina 04: espalda con VibraAlto.cl, 32 reps y sello VBC"><figcaption><b>Lámina 04</b> · Espalda y sponsor</figcaption></figure>
<figure id="l05"><img src="TEAMBANANA_L05_Produccion.jpg" alt="Lámina 05: tintas, medidas y técnicas de estampado"><figcaption><b>Lámina 05</b> · Ficha de producción</figcaption></figure>
